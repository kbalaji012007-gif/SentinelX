[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelx-ai"
version = "0.1.0"
description = "SentinelX AI – Autonomous Security Operations Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "SentinelX Team"},
]
keywords = ["cybersecurity", "soc", "security-operations", "threat-detection", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.31.0",
    "alembic>=1.16.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.0",
    "bcrypt>=4.3.0",
    "cryptography>=45.0.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "structlog>=25.0.0",
    "google-genai>=1.14.0",
    "supabase>=2.15.0",
    "celery>=5.5.0",
    "redis>=6.2.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.1.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=app --cov-report=term-missing"
